# golangci-lint v2. Набор намеренно небольшой: агент — один файл без
# зависимостей, и линтер здесь нужен, чтобы ловить необработанные ошибки и
# мёртвый код, а не чтобы спорить о стиле.
version: '2'

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - misspell
    - revive

  settings:
    errcheck:
      # Запись истории — best-effort: упавший файл агрегата не должен ронять
      # обход, поэтому ошибки writeJSON гасятся явным `_ =`.
      check-blank: false
      # `defer resp.Body.Close()` — идиома, и оборачивать её в замыкание ради
      # ошибки, с которой всё равно нечего делать, значит ухудшить читаемость
      # ради формальности.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (net.Conn).Close
        - (*crypto/tls.Conn).Close
    misspell:
      locale: US
      # `neighbours` — не опечатка, а слово из контракта событий выкатки
      # (deploy-kit/docs/events.md: причина `neighbours_failed`, переменная
      # NEIGHBOURS в описаниях целей). Починить «опечатку» здесь значит
      # перестать понимать то, что присылает выкатка.
      ignore-rules:
        - neighbours

formatters:
  enable:
    - gofmt
