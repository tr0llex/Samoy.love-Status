name: deploy

# Публикация страницы на GitHub Pages.
#
# paths-ignore на data/** принципиален: пробер коммитит туда каждые 5 минут,
# и без этого фильтра Pages пересобирались бы 288 раз в сутки. Свежие данные
# страница берёт напрямую с raw.githubusercontent во время работы, поэтому
# передеплой ради них не нужен — только ради изменений кода.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Проверяем канонический адрес выкатки, а не status.samoy.love: пока
      # CNAME-записи нет, кастомный домен не резолвится, и красный workflow
      # говорил бы о проблеме с DNS, а не с публикацией.
      - name: Проверить, что страница жива
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$PAGE_URL" || true)
            echo "попытка $i: HTTP $code ($PAGE_URL)"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::страница не отвечает 200 после публикации: $PAGE_URL"
          exit 1

      # Кастомный домен проверяем мягко: до настройки DNS это ожидаемо не работает.
      - name: Проверить кастомный домен (необязательно)
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://status.samoy.love/ || true)
          if [ "$code" = "200" ]; then
            echo "status.samoy.love отвечает 200"
          else
            echo "::warning::status.samoy.love вернул $code — проверьте CNAME-запись в DNS"
          fi
