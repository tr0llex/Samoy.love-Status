name: Deploy

# Три независимые цели: страница, агент, который собирает для неё данные, и
# бот, который эти данные пересказывает в Telegram. Разделены сознательно —
# правка страницы не должна перезапускать сбор метрик, обновление агента не
# должно ждать пересборки статики, а перезапуск бота не должен задевать ни то,
# ни другое.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'data/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Что катим'
        type: choice
        options: [all, site, agent, bot]
        default: all
      dry-run:
        type: boolean
        default: false

jobs:
  site:
    # На push инпутов нет — катим всё; на ручном запуске выбирают цель.
    if: inputs.target == '' || inputs.target == 'all' || inputs.target == 'site'
    uses: tr0llex/deploy-kit/.github/workflows/static-site.yml@main
    with:
      config: .deploy-kit/site.env
      nginx-conf: deploy/nginx/status.samoy.love.conf
      gates: npm ci && npm run build
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  agent:
    if: inputs.target == '' || inputs.target == 'all' || inputs.target == 'agent'
    uses: tr0llex/deploy-kit/.github/workflows/go-service.yml@main
    with:
      config: .deploy-kit/agent.env
      workdir: agent
      gates: go vet ./... && go test ./... -race -coverprofile=coverage.out -covermode=atomic
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit

  bot:
    if: inputs.target == '' || inputs.target == 'all' || inputs.target == 'bot'
    uses: tr0llex/deploy-kit/.github/workflows/go-service.yml@main
    with:
      config: .deploy-kit/bot.env
      workdir: bot
      gates: go vet ./... && go test ./... -race -coverprofile=coverage.out -covermode=atomic
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
