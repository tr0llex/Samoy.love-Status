name: deploy

# Публикация страницы на GitHub Pages.
#
# paths-ignore на data/** принципиален: пробер коммитит туда каждые 5 минут,
# и без этого фильтра Pages пересобирались бы 288 раз в сутки. Свежие данные
# страница берёт напрямую с raw.githubusercontent во время работы, поэтому
# передеплой ради них не нужен — только ради изменений кода.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Проверяем доступность по двум адресам.
      #
      # page_url — это кастомный домен, как только он прописан в настройках
      # Pages. Пока CNAME-записи в DNS нет, он не резолвится, и падение здесь
      # означало бы проблему с DNS, а не с публикацией. Поэтому запасной
      # вариант — служебный адрес *.github.io, который работает всегда:
      # до настройки домена отдаёт сайт сам, после — редиректит на домен
      # (отсюда -L). Шаг падает, только если недоступны ОБА адреса.
      - name: Проверить, что страница жива
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          FALLBACK_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          check() {
            for i in $(seq 1 6); do
              code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 "$1" || true)
              echo "  попытка $i: HTTP $code"
              [ "$code" = "200" ] && return 0
              sleep 5
            done
            return 1
          }

          echo "Кастомный домен: $PAGE_URL"
          if check "$PAGE_URL"; then
            echo "✓ страница доступна на кастомном домене"
            exit 0
          fi

          echo "::warning::$PAGE_URL недоступен — вероятно, ещё нет CNAME-записи в DNS"
          echo "Служебный адрес: $FALLBACK_URL"
          if check "$FALLBACK_URL"; then
            echo "✓ публикация прошла, сайт доступен на служебном адресе"
            exit 0
          fi

          echo "::error::страница недоступна ни на $PAGE_URL, ни на $FALLBACK_URL"
          exit 1
