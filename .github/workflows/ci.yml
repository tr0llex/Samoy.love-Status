name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  #
  # Записанного правила оказалось мало: трейлер `Co-Authored-By: Claude` уехал
  # в тридцать семь коммитов подряд, и убирать его пришлось переписыванием
  # опубликованной истории. Локальный хук (.githooks/commit-msg) ловит это
  # раньше, но он включается вручную и в клоне отсутствует — здесь страховка.
  commits:
    name: Коммиты без упоминаний ИИ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Проверить сообщения
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            RANGE="origin/main..HEAD"
          fi
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  agent:
    name: Агент (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: go vet
        working-directory: agent
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: agent

      - name: Тесты
        working-directory: agent
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Отправить покрытие в Codecov
        uses: codecov/codecov-action@v7
        with:
          files: agent/coverage.out
          flags: agent
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  bot:
    name: Бот (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: bot/go.mod
          cache-dependency-path: bot/go.sum

      - name: go vet
        working-directory: bot
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: bot

      - name: Тесты
        working-directory: bot
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Отправить покрытие в Codecov
        uses: codecov/codecov-action@v7
        with:
          files: bot/coverage.out
          flags: bot
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  page:
    name: Страница
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Линтеры идут до сборки: они падают за секунды, сборка — дольше.
      - name: ESLint
        run: npm run lint
      - name: Формат
        run: npm run format:check
      - name: Типы и шаблоны
        run: npm run check

      - run: npm run build

      # Конфиг читают и агент, и внешний сторож — синтаксическая ошибка
      # в нём ломает обоих разом.
      - name: Проверить конфиг проверок
        run: node -e "const c=require('./config/status.json'); if(!c.projects?.length) throw new Error('в конфиге нет проектов'); for(const p of c.projects){ if(!p.checks?.length) throw new Error('у проекта '+p.id+' нет проверок'); }"

  e2e:
    name: Сквозные тесты
    runs-on: ubuntu-latest

    # Проверка после выкатки смотрит на код ответа. Статус-страница отдаёт 200
    # даже когда данных нет, скрипт упал на неожиданном поле и на экране пусто.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Кэшируем ровно ту версию браузера, что просит установленный Playwright:
      # иначе после обновления пакета в кэше останется несовместимый бинарник.
      - name: Версия Playwright
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # Ставим только Chromium — прогон идёт в нём одном, остальные браузеры
      # это лишние сотни мегабайт на каждый PR.
      - name: Поставить Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Системные библиотеки для Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Конфиг сам собирает страницу и поднимает preview. Данные проверок
      # подменяются наборами из e2e/fixtures — живой summary.json тут не нужен.
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
