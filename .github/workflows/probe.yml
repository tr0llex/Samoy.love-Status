name: probe

# Обход сервисов каждые 5 минут — минимальный интервал cron у GitHub Actions.
# Репозиторий публичный, поэтому минуты не тратятся из лимита.
#
# Важно: проверки идут ИЗ GitHub, а не с сервера samoy.love. Если хост лежит,
# этот workflow продолжает работать и зафиксирует падение — ради этого всё и затевалось.
#
# Секреты (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN  — токен бота от @BotFather
#   TELEGRAM_CHAT_ID    — куда слать (свой id можно узнать у @userinfobot)
# Без них пробер работает молча, только пишет данные.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      notify_test:
        description: 'Прислать текущий статус в Telegram (проверка канала)'
        type: boolean
        default: false

# Две одновременные проверки подрались бы за push в data/.
concurrency:
  group: probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Прошлое состояние лежит на отдельной ветке: main защищён, и бот
      # не может (и не должен) писать в неё каждые 5 минут.
      - name: Забрать прошлое состояние
        run: |
          git fetch origin status-data --depth=1 2>/dev/null             && git checkout origin/status-data -- data             || echo "ветки данных ещё нет — первый запуск"

      - name: Обойти сервисы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_TEST: ${{ inputs.notify_test }}
        run: node scripts/probe.mjs

      - name: Сохранить результат
        run: |
          git config user.name  'status-probe'
          git config user.email 'status-probe@users.noreply.github.com'
          git checkout -B status-data
          git add -f data
          # Данные не изменились — коммитить нечего, это нормальный исход.
          if git diff --cached --quiet; then
            echo 'изменений нет'
            exit 0
          fi
          git commit -m "probe: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Ветка — приватная память пробера, история в ней не нужна:
          # force-push избавляет от гонок между запусками.
          git push -f origin status-data
